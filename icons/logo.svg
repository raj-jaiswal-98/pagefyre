<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <defs>
    <!-- Brass Metallic Gradient for Letterforms -->
    <linearGradient id="logoBrassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE68A"/>
      <stop offset="40%" stop-color="#E4BE6B"/>
      <stop offset="70%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8E6920"/>
    </linearGradient>

    <!-- Parchment Fill for Primary Wordmark Body -->
    <linearGradient id="logoParchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F3E9D2"/>
      <stop offset="100%" stop-color="#D7CAAC"/>
    </linearGradient>

    <!-- Flame-Tipped Quill / Dragon Wing Aurora Gradient -->
    <linearGradient id="flameQuillAurora" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#C9A24B"/>
      <stop offset="25%" stop-color="#FF7A1A"/>
      <stop offset="55%" stop-color="#F0ABFC"/>
      <stop offset="80%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <!-- Flame Ember Glow Filter -->
    <filter id="flameGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Group for Logo Lockup -->
  <g transform="translate(4, 2)">
    <!-- Small Decorative Grimoire Margin Rune Left -->
    <path d="M 6,36 L 12,30 L 18,36 L 12,42 Z" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
    <circle cx="12" cy="36" r="1.5" fill="#5EEAD4"/>

    <!-- Main Wordmark: PAGEF -->
    <text x="26" y="44" 
          font-family="'UnifrakturCook', 'Pirata One', 'Cinzel Decorative', Georgia, serif" 
          font-size="36" 
          font-weight="bold" 
          letter-spacing="1.5"
          fill="url(#logoParchmentGrad)" 
          stroke="url(#logoBrassGrad)" 
          stroke-width="0.8">PAGEF</text>

    <!-- Stylized 'Y' as Flame-Tipped Quill & Dragon Wing -->
    <g id="stylized-y-flame-wing" transform="translate(178, 4)">
      <!-- Left Stem of Y -->
      <path d="M 0,16 C 4,24 8,30 14,35 L 14,40 C 9,34 5,28 0,16 Z" 
            fill="url(#logoParchmentGrad)" stroke="#C9A24B" stroke-width="0.5"/>

      <!-- Central Quill Stem & Desender -->
      <path d="M 14,35 L 14,46 C 14,50 11,54 6,56 L 6,58 C 13,56 17,52 17,45 L 17,35 Z" 
            fill="url(#logoParchmentGrad)" stroke="#C9A24B" stroke-width="0.5"/>

      <!-- Right Arm of Y Arching into Wing & Flame-Tipped Quill -->
      <path d="M 28,14 C 23,24 18,30 14,35 L 17,35 C 21,30 26,24 31,14 Z" 
            fill="url(#logoParchmentGrad)"/>

      <!-- Dragon Wing Ribs & Plumes (Arching Gracefully) -->
      <path d="M 16,33 
               C 22,25 29,18 36,9 
               C 34,14 36,18 41,18 
               C 38,22 40,26 44,28 
               C 39,29 36,33 34,38 
               C 29,38 23,37 16,33 Z" 
            fill="url(#flameQuillAurora)" opacity="0.95" filter="url(#flameGlow)"/>

      <!-- Quill Nib / Central Dragon Horn Accent -->
      <path d="M 33,12 C 34,6 38,2 43,-2 C 40,5 41,8 39,12 Z" 
            fill="#5EEAD4" filter="url(#flameGlow)"/>

      <!-- Golden Quill Slit -->
      <line x1="28" y1="20" x2="38" y2="6" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Floating Aurora Spark Particles -->
      <circle cx="45" cy="0" r="1.5" fill="#F0ABFC"/>
      <circle cx="39" cy="-5" r="1.2" fill="#5EEAD4"/>
      <circle cx="48" cy="8" r="1.0" fill="#FF7A1A"/>
    </g>

    <!-- Trailing 'RE' in PageFyre -->
    <text x="228" y="44" 
          font-family="'UnifrakturCook', 'Pirata One', 'Cinzel Decorative', Georgia, serif" 
          font-size="36" 
          font-weight="bold" 
          letter-spacing="1.5"
          fill="url(#logoParchmentGrad)" 
          stroke="url(#logoBrassGrad)" 
          stroke-width="0.8">RE</text>

    <!-- Small Decorative Grimoire Margin Rune Right -->
    <path d="M 295,36 L 301,30 L 307,36 L 301,42 Z" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
    <circle cx="301" cy="36" r="1.5" fill="#5EEAD4"/>

    <!-- Grimoire Thin Brass Divider Line Under Title -->
    <line x1="26" y1="52" x2="292" y2="52" stroke="#C9A24B" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="159" cy="52" r="2.5" fill="#C9A24B"/>
    <circle cx="159" cy="52" r="1.2" fill="#FDE68A"/>

    <!-- Tagline: "HERE BE DRAGONS. ON ANY WEBPAGE." -->
    <text x="159" y="65" 
          font-family="'Inter', 'Space Grotesk', system-ui, sans-serif" 
          font-size="8.5" 
          font-weight="700" 
          letter-spacing="3.2" 
          text-anchor="middle"
          fill="#C9A24B">HERE BE DRAGONS. ON ANY WEBPAGE.</text>
  </g>
</svg>
